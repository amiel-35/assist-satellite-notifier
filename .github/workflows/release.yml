name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Zip the integration
        working-directory: custom_components/assist_satellite_notifier
        run: zip -r ${{ github.workspace }}/assist_satellite_notifier.zip . -x '.*'

      - name: Extract release notes from CHANGELOG.md
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { found=1; capture=1; next }
            capture && /^## / { capture=0 }
            capture { print }
            END { exit(found ? 0 : 1) }
          ' CHANGELOG.md > release_notes.md; then
            echo "::error::CHANGELOG.md has no '## [$VERSION]' section for tag $GITHUB_REF_NAME. Add one before tagging."
            exit 1
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: assist_satellite_notifier.zip
          body_path: release_notes.md
